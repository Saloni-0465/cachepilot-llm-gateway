services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cachepilot
      POSTGRES_USER: cachepilot
      POSTGRES_PASSWORD: cachepilot_local_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cachepilot -d cachepilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
